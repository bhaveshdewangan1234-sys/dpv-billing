<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
  </defs>

  <!-- Camera & Aperture Emblem -->
  <g transform="translate(10, 15)">
    <!-- Camera Body Outline -->
    <rect x="5" y="20" width="75" height="55" rx="12" fill="none" stroke="url(#blueGrad)" stroke-width="4.5" />
    <!-- Viewfinder bump -->
    <path d="M28 20 L35 10 L50 10 L57 20 Z" fill="none" stroke="url(#blueGrad)" stroke-width="4.5" stroke-linejoin="round" />
    <!-- Golden Aperture / Lens -->
    <circle cx="42.5" cy="47.5" r="20" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
    <circle cx="42.5" cy="47.5" r="10" fill="url(#goldGrad)" opacity="0.3" />
    <!-- Shutter Blades -->
    <line x1="42.5" y1="27.5" x2="52.5" y2="40" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="62.5" y1="47.5" x2="49" y2="57.5" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="42.5" y1="67.5" x2="32.5" y2="55" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="22.5" y1="47.5" x2="36" y2="37.5" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <!-- Lens reflection dot -->
    <circle cx="48" cy="42" r="2.5" fill="#ffffff" />
    <circle cx="70" cy="28" r="2.5" fill="url(#goldGrad)" />
  </g>

  <!-- Typography -->
  <text x="105" y="52" font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="29" font-weight="800" fill="#1e3a8a" letter-spacing="1.5">
    DEWANGAN <tspan fill="#d97706" font-style="italic">&amp;</tspan> VIDEOGRAPHY
  </text>
  <text x="106" y="74" font-family="'Inter', 'Segoe UI', sans-serif" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="3.2">
    PROFESSIONAL CANDID PHOTOGRAPHY &amp; CINEMATIC FILMS
  </text>

  <!-- Accent Divider -->
  <line x1="106" y1="84" x2="480" y2="84" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <circle cx="106" cy="84" r="2" fill="#d97706" />
  <circle cx="480" cy="84" r="2" fill="#d97706" />
</svg>
